name: maskan_app
description: "مسكن - نظام إدارة العقارات السكنية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.8.1
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  pusher_channels_flutter: ">=2.4.0 <2.5.0"
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.5
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  curved_navigation_bar: ^1.0.6
  geolocator: ^14.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1a3a5c"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_wght.ttf
